services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cri_test
      POSTGRES_USER: cri_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cri_test -d cri_test"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [cri-test]
    tmpfs: [/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [cri-test]
    tmpfs: [/data]
  opa:
    image: openpolicyagent/opa:1.4.2
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes: ["./infra/policies:/policies:ro"]
    healthcheck:
      test: ["CMD", "/opa", "eval", "true"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [cri-test]
networks:
  cri-test:
    internal: true
