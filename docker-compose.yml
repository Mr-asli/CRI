services:
  api:
    image: cri-api:ci
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CRI_DATA_DIR: /data
      CRI_AUDIT_FILE: /data/audit.jsonl
      CRI_KILL_FILE: /data/KILL
      CRI_NONCE_DB: /data/approval_nonces.sqlite3
      CRI_ADMIN_TOKEN: ${CRI_ADMIN_TOKEN:?Set CRI_ADMIN_TOKEN in .env}
      CRI_APPROVAL_SECRET: ${CRI_APPROVAL_SECRET:?Set CRI_APPROVAL_SECRET in .env}
    volumes:
      - cri-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
volumes:
  cri-data:
