[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cri-prototype"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn[standard]==0.34.2",
  "pydantic==2.11.4",
  "SQLAlchemy==2.0.50",
  "psycopg[binary]==3.2.6",
  "pgvector==0.4.1",
  "redis==8.2.0",
  "boto3>=1.35,<2",
]

[project.optional-dependencies]
test = ["pytest==9.0.3", "httpx==0.28.1", "hypothesis==6.131.9", "coverage==7.8.0"]

[project.scripts]
cri-audit = "cri.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools]
packages = { find = { where = ["."], include = ["cri", "cri.*"], namespaces = false } }
