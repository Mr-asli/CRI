# Internal use only — private CRI CI workflow.
name: CRI Internal CI
on:
  workflow_dispatch:
  push:
    paths-ignore: ['**/*.md', 'docs/**', '.gitignore']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', '.gitignore']
concurrency:
  group: cri-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install ruff==0.15.19 mypy fastapi pydantic
      - run: ruff check backend tests
      - run: mypy backend/cri --ignore-missing-imports
  unit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -e 'backend[test]' coverage
      - run: coverage run --source=cri -m pytest -q tests/test_core.py tests/test_api_security.py
      - run: coverage report -m
      - run: coverage json -o coverage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            .coverage
            coverage.json
          if-no-files-found: warn
  integration:
    needs: unit
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate required CI secrets
        run: test -n "$POSTGRES_PASSWORD" && test -n "$REDIS_PASSWORD"
      - name: Build backend with BuildKit cache
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: cri-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker compose -f docker-compose.test.yml up -d
      - run: ./scripts/wait-for-healthy.sh postgres 120
      - run: ./scripts/wait-for-healthy.sh redis 120
      - run: docker compose -f docker-compose.test.yml ps
      - if: always()
        run: docker compose -f docker-compose.test.yml logs --no-color > integration-logs.txt || true
      - if: always()
        run: docker compose -f docker-compose.test.yml down --volumes --remove-orphans
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: integration-logs, path: integration-logs.txt, if-no-files-found: warn}
  security:
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -e 'backend[test]'
      - run: PYTHONPATH=backend pytest -q tests/security tests/test_security.py tests/test_core.py
  e2e:
    needs: security
    runs-on: ubuntu-latest
    env:
      CRI_ADMIN_TOKEN: ${{ secrets.CRI_ADMIN_TOKEN }}
      CRI_APPROVAL_SECRET: ${{ secrets.APPROVAL_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate required CI secrets
        run: test -n "$CRI_ADMIN_TOKEN" && test -n "$CRI_APPROVAL_SECRET"
      - name: Build API with BuildKit cache
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: cri-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run compose smoke E2E
        run: ./scripts/run-e2e-demo.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: e2e-logs, path: artifacts/, if-no-files-found: warn}
  dashboard:
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require real dashboard source
        run: test -f dashboard/package.json || { echo 'Dashboard implementation is not present; refusing to report a fake green build.' >&2; exit 1; }
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - working-directory: dashboard
        run: npm install --no-audit --no-fund
      - working-directory: dashboard
        run: npm run lint && npm run build && npm test -- --run
