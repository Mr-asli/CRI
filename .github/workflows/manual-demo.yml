# Internal use only — private manual demo workflow.
name: CRI Manual Docker Demo
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      CRI_ADMIN_TOKEN: ${{ secrets.CRI_ADMIN_TOKEN }}
      CRI_APPROVAL_SECRET: ${{ secrets.APPROVAL_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate secrets
        run: test -n "$CRI_ADMIN_TOKEN" && test -n "$CRI_APPROVAL_SECRET"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: cri-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start demo topology
        run: ./scripts/run-e2e-demo.sh
      - name: Capture compose state and logs
        if: always()
        run: mkdir -p artifacts && docker compose ps > artifacts/services.txt && docker compose logs --no-color > artifacts/logs.txt || true
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: cri-manual-demo, path: artifacts/, if-no-files-found: warn}
      - if: always()
        run: docker compose down --volumes --remove-orphans || true
